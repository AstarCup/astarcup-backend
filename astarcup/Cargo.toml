[package]
name = "astarcup"
version = "0.0.1"
authors = ["AeCw <aecbanana@outlook.com>"]
edition = "2024"

[dependencies]
dotenv = "0.15.0"
serde_json = "1.0.48"
thiserror = "2.0.18"
tracing = "0.1.37"

[dependencies.axum]
features = []
version = "0.8.8"

[dependencies.serde]
features = ["derive"]
version = "1.0.105"


[dependencies.tokio]
features = ["full"]
version = "1.28.2"

[dependencies.tower-http]
features = ["cors", "trace"]
version = "0.3.5"

[dependencies.sea-orm]
features = ["sqlx-postgres","macros","chrono"]
version = "1.1.19"
