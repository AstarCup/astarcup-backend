[package]
name = "astracup-backend"
version = "0.1.0"
edition = "2024"
authors = ["AstraCup Team"]
description = "AstraCup tournament management backend"
license = "MIT"
repository = "https://github.com/AECBanana/astracup-web"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sea-orm = { version = "0.12", features = ["sqlx-mysql", "runtime-tokio-native-tls", "macros"] }
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-native-tls"] }
dotenv = "0.15"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication and security
jsonwebtoken = "9.0"
bcrypt = "0.15"
argon2 = "0.5"
rand = "0.8"

# HTTP client for OAuth
reqwest = { version = "0.11", features = ["json"] }

# Configuration
config = "0.13"
anyhow = "1.0"
thiserror = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
futures = "0.3"
axum-extra = "0.12.5"

[dev-dependencies]
# Testing
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
mockall = "0.11"

# Database testing
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-native-tls"] }

# SeaORM CLI for code generation
# sea-orm-cli = { version = "0.12.15", features = ["sqlx-mysql"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
