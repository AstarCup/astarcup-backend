name: Backend Build & Deploy (Linux x86_64)

# 仅针对 Linux x86_64 构建后端（ubuntu-latest = x86_64 Linux）
# push 到 master/main 时构建并自动部署到服务器（需配置 SSH secrets）
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ascBackend (linux x86_64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ascBackend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # diesel(postgres) 需要 libpq，reqwest(native-tls) 需要 openssl
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev pkg-config

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ascBackend

      - name: Build (release)
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascBackend-linux-x86_64
          path: ascBackend/target/release/ascBackend
          if-no-files-found: error

  deploy:
    name: Deploy to server (SSH)
    needs: build
    # 仅 push / 手动触发时部署（pull_request 不部署）
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ascBackend-linux-x86_64
          path: ./binary

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/ascBackend' }}
          BINARY_NAME: ${{ vars.BINARY_NAME || 'ascBackend' }}
          RUN_ARGS: ${{ vars.RUN_ARGS || 'dev' }}
          APP_PORT: ${{ secrets.APP_PORT || '4000' }}
          SCREEN_NAME: ${{ vars.SCREEN_NAME || 'asc' }}
        if: env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != ''
        run: |
          set -euo pipefail
          echo "Deploy config => user:${SSH_USER} host:${SSH_HOST} port:${SSH_PORT} path:${DEPLOY_PATH} binary:${BINARY_NAME} args:${RUN_ARGS} appPort:${APP_PORT} screen:${SCREEN_NAME}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 公共连接参数；注意 scp 端口是 -P（大写），ssh 端口是 -p（小写）
          SSH_COMMON="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -i ~/.ssh/deploy_key"

          # 1) 上传新二进制（临时文件名 .new，避免覆盖运行中的文件）
          scp $SSH_COMMON -P "$SSH_PORT" ./binary/ascBackend "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/${BINARY_NAME}.new"

          # 2) 远程重启：停旧进程 → 替换二进制 → 在 screen 会话内启动 → 健康检查
          ssh $SSH_COMMON -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" "set -e; \
            mkdir -p '${DEPLOY_PATH}/logs'; cd '${DEPLOY_PATH}'; \
            pgrep -x '${BINARY_NAME}' | xargs -r kill 2>/dev/null || true; \
            pkill -f '^\./${BINARY_NAME}' 2>/dev/null || true; \
            sleep 1; \
            mv -f '${BINARY_NAME}.new' '${BINARY_NAME}'; \
            chmod +x '${BINARY_NAME}'; \
            screen -S '${SCREEN_NAME}' -X quit 2>/dev/null || true; \
            sleep 1; \
            screen -dmS '${SCREEN_NAME}' sh -c 'cd ${DEPLOY_PATH} && exec ./${BINARY_NAME} ${RUN_ARGS}'; \
            sleep 2; \
            curl -s -o /dev/null -w 'health:%{http_code}\n' http://localhost:${APP_PORT}/api/auth/me || echo 'health-check-failed'"

      - name: Warn if SSH secrets not configured
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        if: env.SSH_HOST == '' || env.SSH_USER == '' || env.SSH_KEY == ''
        run: echo "::warning::SSH secrets (SSH_HOST / SSH_USER / SSH_PRIVATE_KEY) 未配置，跳过自动部署。请在仓库 Settings → Secrets and variables → Actions 中配置。"
