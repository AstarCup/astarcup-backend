name: Backend Build & Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # PR：仅验证可编译，不部署
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev pkg-config
      - name: Cargo check
        run: cargo check --manifest-path ascBackend/Cargo.toml

  # 推送 master/main：CI 构建 release 二进制 -> scp 上传 -> 服务器 systemd 重启
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || '' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER || '' }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY || '' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/ascBackend' }}
      BINARY_NAME: ${{ vars.BINARY_NAME || 'ascBackend' }}
      RUN_ARGS: ${{ vars.RUN_ARGS || 'dev' }}
      APP_PORT: ${{ secrets.APP_PORT || '4000' }}
      UNIT_NAME: ${{ vars.UNIT_NAME || 'ascBackend' }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev pkg-config
      - name: Build release
        run: cargo build --release --manifest-path ascBackend/Cargo.toml

      - name: Warn if SSH not configured
        if: env.SSH_HOST == '' || env.SSH_USER == '' || env.SSH_KEY == ''
        run: echo "::warning::SSH secrets (SSH_HOST / SSH_USER / SSH_PRIVATE_KEY) 未配置，跳过自动部署。请在仓库 Settings → Secrets and variables → Actions 中配置。"

      - name: Deploy to server
        if: env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != ''
        run: |
          set -euo pipefail

          echo "Deploy config => user:${SSH_USER} host:${SSH_HOST} port:${SSH_PORT} path:${DEPLOY_PATH} binary:${BINARY_NAME} args:${RUN_ARGS} appPort:${APP_PORT} unit:${UNIT_NAME}"

          # 准备 SSH key
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          SSH_COMMON="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $HOME/.ssh/deploy_key"

          # 1) 上传二进制
          echo "== scp upload =="
          scp $SSH_COMMON -P "$SSH_PORT" ascBackend/target/release/ascBackend "${SSH_USER}@${SSH_HOST}:/tmp/ascBackend.new"

          # 2) 服务器安装 + systemd 重启
          echo "== remote install =="
          ssh $SSH_COMMON -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" "SUDO=''; [ \"\$(id -u)\" != '0' ] && SUDO='sudo'; \$SUDO bash -s" <<EOF
          set -euo pipefail
          BINARY_NAME='${BINARY_NAME}'
          DEPLOY_PATH='${DEPLOY_PATH}'
          RUN_ARGS='${RUN_ARGS}'
          APP_PORT='${APP_PORT}'
          UNIT_NAME='${UNIT_NAME}'

          echo "== 安装二进制到 \${DEPLOY_PATH} =="
          mkdir -p "\${DEPLOY_PATH}"
          chmod +x /tmp/ascBackend.new
          mv -f /tmp/ascBackend.new "\${DEPLOY_PATH}/\${BINARY_NAME}"
          chmod +x "\${DEPLOY_PATH}/\${BINARY_NAME}"

          echo "== 停旧进程 =="
          pkill -f "^\./\${BINARY_NAME}" 2>/dev/null || true
          pkill -f "\${BINARY_NAME}" 2>/dev/null || true

          echo "== 写入 systemd unit =="
          cat > /etc/systemd/system/\${UNIT_NAME}.service <<UNIT_EOF
          [Unit]
          Description=Astra Cup Backend
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=\${DEPLOY_PATH}
          ExecStart=\${DEPLOY_PATH}/\${BINARY_NAME} \${RUN_ARGS}
          Restart=on-failure
          RestartSec=3
          EnvironmentFile=\${DEPLOY_PATH}/.env

          [Install]
          WantedBy=multi-user.target
          UNIT_EOF

          systemctl daemon-reload
          systemctl enable \${UNIT_NAME} 2>/dev/null || true
          systemctl restart \${UNIT_NAME} || { echo "service:restart-failed"; journalctl -u \${UNIT_NAME} -n 30 --no-pager; exit 1; }

          sleep 2
          if systemctl is-active --quiet \${UNIT_NAME}; then
            echo "service:active"
          else
            echo "service:inactive"
            journalctl -u \${UNIT_NAME} -n 30 --no-pager
            exit 1
          fi

          echo "== 健康检查 =="
          for i in 1 2 3 4 5; do
            CODE=\$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:\${APP_PORT}/api/auth/me" || echo 000)
            echo "health:\${CODE}"
            [ "\${CODE}" != "000" ] && exit 0
            sleep 2
          done
          echo "health:unreachable"
          exit 1
          EOF
