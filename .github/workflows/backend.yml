name: Backend Build & Deploy (Linux x86_64)

# 仅针对 Linux x86_64 构建后端（ubuntu-latest = x86_64 Linux）
# push 到 master/main 时构建并自动部署到服务器（需配置 SSH secrets）
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ascBackend (linux x86_64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ascBackend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # diesel(postgres) 需要 libpq，reqwest(native-tls) 需要 openssl
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev pkg-config

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ascBackend

      - name: Build (release)
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascBackend-linux-x86_64
          path: ascBackend/target/release/ascBackend
          if-no-files-found: error

  deploy:
    name: Deploy to server (SSH)
    needs: build
    # 仅 push / 手动触发时部署（pull_request 不部署）
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ascBackend-linux-x86_64
          path: ./binary

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/ascBackend' }}
          BINARY_NAME: ${{ vars.BINARY_NAME || 'ascBackend' }}
          RUN_ARGS: ${{ vars.RUN_ARGS || 'dev' }}
          UNIT_NAME: ${{ vars.UNIT_NAME || 'ascBackend.service' }}
          SCREEN_NAME: ${{ vars.SCREEN_NAME || 'asc' }}
        if: env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != ''
        run: |
          set -euo pipefail
          echo "Deploy config => user:${SSH_USER} host:${SSH_HOST} port:${SSH_PORT} path:${DEPLOY_PATH} binary:${BINARY_NAME} args:${RUN_ARGS} unit:${UNIT_NAME}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 公共连接参数；注意 scp 端口是 -P（大写），ssh 端口是 -p（小写）
          SSH_COMMON="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -i ~/.ssh/deploy_key"

          # 1) 上传新二进制（临时文件名 .new，避免覆盖运行中的文件）
          scp $SSH_COMMON -P "$SSH_PORT" ./binary/ascBackend "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/${BINARY_NAME}.new"

          # 2) 生成远程部署脚本（引号 heredoc：脚本原样写入，运行参数通过环境变量传入）
          cat > /tmp/asc-deploy.sh <<'SCRIPT_EOF'
          set -euo pipefail
          mkdir -p "${DEPLOY_PATH}/logs"
          cd "${DEPLOY_PATH}"

          # 停掉旧的 screen/nohup 后端进程，避免端口冲突
          pgrep -x "${BINARY_NAME}" | xargs -r kill 2>/dev/null || true
          pkill -f "^\./${BINARY_NAME}" 2>/dev/null || true
          # 清理旧的同名 screen 会话（如有）
          screen -ls "${SCREEN_NAME}" 2>/dev/null | awk '$1 ~ /^[0-9]+\./ {print $1}' | while read -r s; do screen -S "$s" -X quit 2>/dev/null || true; done || true
          sleep 1

          # 替换二进制
          mv -f "${BINARY_NAME}.new" "${BINARY_NAME}"
          chmod +x "${BINARY_NAME}"

          # root 直接执行，否则需要免密 sudo
          if [ "$(id -u)" = "0" ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          # 写入 systemd unit（幂等）
          $SUDO tee "/etc/systemd/system/${UNIT_NAME}" > /dev/null <<UNIT_EOF
          [Unit]
          Description=AstraCup Backend
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=${DEPLOY_PATH}
          ExecStart=${DEPLOY_PATH}/${BINARY_NAME} ${RUN_ARGS}
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNIT_EOF

          $SUDO systemctl daemon-reload
          $SUDO systemctl enable "${UNIT_NAME}" >/dev/null 2>&1 || true
          $SUDO systemctl restart "${UNIT_NAME}"
          sleep 3

          if [ "$($SUDO systemctl is-active "${UNIT_NAME}")" = "active" ]; then
            echo "service:active"
          else
            echo "service:inactive"
            $SUDO journalctl -u "${UNIT_NAME}" -n 30 --no-pager 2>/dev/null | tail -n 30 || true
          fi

          # 健康检查（直接请求公网地址）
          curl -s -o /dev/null -w 'health:%{http_code}\n' "https://rino.ink/api" || echo 'health-check-failed'
          SCRIPT_EOF

          # 3) 上传脚本并以环境变量方式执行（root 或免密 sudo）
          scp $SSH_COMMON -P "$SSH_PORT" /tmp/asc-deploy.sh "${SSH_USER}@${SSH_HOST}:/tmp/asc-deploy.sh"
          ssh $SSH_COMMON -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" "DEPLOY_PATH='$DEPLOY_PATH' BINARY_NAME='$BINARY_NAME' RUN_ARGS='$RUN_ARGS' UNIT_NAME='$UNIT_NAME' SCREEN_NAME='$SCREEN_NAME' bash /tmp/asc-deploy.sh && rm -f /tmp/asc-deploy.sh"

      - name: Warn if SSH secrets not configured
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        if: env.SSH_HOST == '' || env.SSH_USER == '' || env.SSH_KEY == ''
        run: echo "::warning::SSH secrets (SSH_HOST / SSH_USER / SSH_PRIVATE_KEY) 未配置，跳过自动部署。请在仓库 Settings → Secrets and variables → Actions 中配置。"
